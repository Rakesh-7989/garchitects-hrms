<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - G-Architects HRMS</title>
    <link rel="icon" type="image/png" href="../assets/images/fav-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="toastContainer" class="toast-container"></div>
    
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">
                    <img src="../assets/images/garchitects_logo.png" alt="G-Architects HRMS Logo" style="width:auto;max-width:220px;height:110px;object-fit:contain;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                    <i class="fas fa-building" style="display:none;font-size:4rem;"></i>
                </div>
                <p>Employee Portal</p>
            </div>
            
            <form class="login-form" onsubmit="handleLogin(event, 'employee')">
                <div class="form-group">
                    <label>Employee ID</label>
                    <div class="input-icon">
                        <i class="fas fa-id-badge"></i>
                        <input type="text" class="form-control" id="employeeId" placeholder="Enter Employee ID" required autocomplete="username">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div style="text-align:right;margin-top:-6px;margin-bottom:12px;">
                    <a href="#" onclick="openForgotPassword();return false;" style="font-size:0.85rem;color:var(--primary);text-decoration:none;display:inline-block;"><i class="fas fa-key" style="margin-right:6px;"></i>Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                    <i class="fas fa-sign-in-alt"></i> Log In
                </button>

                <div style="text-align:center;margin-top:18px;">
                    <a href="/admin" style="font-size:0.85rem;color:var(--text-secondary);text-decoration:none;display:inline-block;"><i class="fas fa-user-shield" style="margin-right:6px;"></i>Admin Login</a>
                </div>
            </form>
        </div>
    </div>
    
    <script src="../js/auth.js"></script>
    <script src="../js/forgot-password.js"></script>
</body>
</html>
