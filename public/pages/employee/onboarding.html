<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Onboarding - G-Architects HRMS</title>
    <link rel="icon" type="image/png" href="../../assets/images/fav-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .onb-hero { display:flex; align-items:center; gap:24px; padding:28px; background:linear-gradient(135deg,var(--primary) 0%,#7C3AED 100%); color:white; border-radius:var(--radius-md); flex-wrap:wrap; }
        .onb-ring { position:relative; width:110px; height:110px; flex-shrink:0; }
        .onb-ring svg { transform:rotate(-90deg); }
        .onb-ring .pct { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:700; }
        .task-card { display:flex; align-items:flex-start; gap:14px; padding:16px 18px; border:1px solid var(--border-color,#eef2f7); border-radius:var(--radius-md); margin-bottom:12px; background:var(--card-bg,#fff); }
        .task-icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:.95rem; }
    </style>
</head>
<body class="employee-app">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo"><i class="fas fa-building" style="color:var(--primary-light);font-size:1.5rem;"></i><span style="font-size:1rem;font-weight:700;">G-Architects HRMS</span></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Main</div>
            <a href="/employee/dashboard" class="nav-item"><i class="fas fa-tachometer-alt"></i><span class="nav-text">Dashboard</span></a>
            <a href="/manager/my-team" id="myTeamLink" style="display:none;" class="nav-item"><i class="fas fa-users"></i><span class="nav-text">My Team</span></a>
            <div class="nav-section-title">My Info</div>
            <a href="/employee/profile" class="nav-item"><i class="fas fa-user"></i><span class="nav-text">My Profile</span></a>
            <a href="/employee/onboarding" class="nav-item active"><i class="fas fa-user-plus"></i><span class="nav-text">My Onboarding</span></a>
            <a href="/employee/my-projects" class="nav-item"><i class="fas fa-project-diagram"></i><span class="nav-text">My Projects</span></a>
            <a href="/employee/attendance" class="nav-item"><i class="fas fa-clock"></i><span class="nav-text">Attendance</span></a>
            <a href="/employee/regularization" class="nav-item"><i class="fas fa-clock-rotate-left"></i><span class="nav-text">Regularization</span></a>
            <a href="/employee/leave" class="nav-item"><i class="fas fa-calendar-times"></i><span class="nav-text">Leave</span></a>
            <a href="/employee/wfh" class="nav-item"><i class="fas fa-home"></i><span class="nav-text">WFH</span></a>
            <a href="/employee/payslips" class="nav-item"><i class="fas fa-indian-rupee-sign"></i><span class="nav-text">Payslips</span></a>
            <div class="nav-section-title">Company</div>
            <a href="/employee/documents" class="nav-item"><i class="fas fa-file-alt"></i><span class="nav-text">Documents</span></a>
            <a href="/employee/announcements" class="nav-item"><i class="fas fa-bullhorn"></i><span class="nav-text">Announcements</span></a>
            <div class="nav-section-title">Support</div>
            <a href="/employee/holidays" class="nav-item"><i class="fas fa-calendar-check"></i><span class="nav-text">Holidays</span></a>
            <div class="nav-section-title">Resources</div>
            <a href="/employee/directory" class="nav-item"><i class="fas fa-address-book"></i><span class="nav-text">Directory</span></a>
            <a href="/employee/tickets" class="nav-item"><i class="fas fa-ticket-alt"></i><span class="nav-text">My Queries</span></a>
        </nav>
    </aside>

    <main class="main-content" id="mainContent">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h2 style="font-size:1.25rem;font-weight:600;">My Onboarding</h2>
            </div>
            <div class="header-right">
                <button type="button" class="notification-btn" title="Notifications"><i class="fas fa-bell"></i><span class="notification-badge" id="notifBadge" style="display:none;"></span></button>
                <button class="notification-btn" onclick="toggleDarkMode()" title="Toggle dark mode"><i class="fas fa-moon" id="themeIcon"></i></button>
                <div style="position:relative">
                    <button class="profile-btn" onclick="toggleProfileMenu()">
                        <span class="profile-photo" id="profilePhoto" style="display:inline-flex;align-items:center;justify-content:center;background:var(--primary);color:white;border-radius:50%;width:36px;height:36px;font-size:0.8rem;font-weight:600;"></span>
                        <span id="profileName" style="margin-left:8px;font-weight:500;"></span>
                        <i class="fas fa-chevron-down" style="margin-left:4px;font-size:0.7rem;"></i>
                    </button>
                    <div class="profile-menu" id="profileMenu" style="display:none;">
                        <a href="/employee/profile" class="profile-menu-item"><i class="fas fa-user"></i> My Profile</a>
                        <div class="profile-menu-divider"></div>
                        <a href="#" class="profile-menu-item danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-body">
            <div id="contentContainer">
                <div style="text-align:center;padding:60px;"><div class="spinner" style="margin:0 auto;"></div></div>
            </div>
        </div>
    </main>

    <!-- Mark-done modal -->
    <div class="modal" id="completeModal">
        <div class="modal-content" style="max-width:440px;">
            <div class="modal-header">
                <h2>Complete Task</h2>
                <button onclick="closeCompleteModal()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-secondary);">&times;</button>
            </div>
            <div class="modal-body">
                <p id="completeTaskTitle" style="font-weight:600;margin-bottom:12px;"></p>
                <div class="form-group">
                    <label>Remarks (optional)</label>
                    <textarea class="form-control" id="completeRemarks" rows="3" placeholder="e.g. Details submitted, met the manager..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeCompleteModal()">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitComplete()"><i class="fas fa-check"></i> Mark as Done</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js"></script>
    <script src="../../js/tickets.js"></script>
    <script>
        if (!checkAuth()) throw new Error('Not authenticated');
        let currentTaskId = null;
        let myTasks = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
        });

        function ringHtml(pct) {
            const r = 46;
            const c = 2 * Math.PI * r;
            const off = c * (1 - pct / 100);
            return '<div class="onb-ring">' +
                '<svg width="110" height="110" viewBox="0 0 110 110">' +
                    '<circle cx="55" cy="55" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="9"/>' +
                    '<circle cx="55" cy="55" r="' + r + '" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
                '</svg>' +
                '<div class="pct">' + pct + '%</div>' +
            '</div>';
        }

        async function loadData() {
            const d = await apiCall('/onboarding/my');
            const container = document.getElementById('contentContainer');
            if (!d || !d.success) {
                showEmptyState(container, 'fa-exclamation-triangle', 'Error', 'Failed to load onboarding data');
                return;
            }

            if (!d.process) {
                container.innerHTML =
                    '<div class="card mb-3 slide-up stagger-1"><div class="empty-state">' +
                    '<i class="fas fa-user-plus"></i><h3>No Onboarding Checklist</h3>' +
                    '<p>Your onboarding checklist has not been started yet.<br>Please contact HR.</p></div></div>';
                return;
            }

            myTasks = d.tasks || [];

            const p = d.progress || { total: 0, done: 0, percent: 0 };
            let html = '<div class="mb-3 slide-up stagger-1"><div class="onb-hero">' +
                ringHtml(p.percent) +
                '<div style="flex:1;min-width:200px;">' +
                    '<h3 style="font-size:1.2rem;font-weight:700;margin-bottom:6px;">' +
                        (p.percent === 100 ? 'Onboarding complete! Welcome aboard.' : 'Welcome to G Architects!') +
                    '</h3>' +
                    '<p style="opacity:.92;font-size:.92rem;">You have completed <strong>' + p.done + '</strong> of <strong>' + p.total + '</strong> onboarding steps.' +
                    (p.percent === 100 ? '' : ' Finish the remaining steps to get fully set up.') + '</p>' +
                '</div></div></div>';

            if (d.tasks.length === 0) {
                html += '<div class="card slide-up stagger-2"><div class="empty-state"><i class="fas fa-tasks"></i><h3>No Tasks</h3><p>This checklist has no tasks yet.</p></div></div>';
            } else {
                html += '<div class="slide-up stagger-2">';
                d.tasks.forEach(t => {
                    const done = t.status === 'done';
                    let iconCls, iconFa, badge;
                    if (done) {
                        iconCls = 'background:#dcfce7;color:#059669;';
                        iconFa = 'fa-check';
                        badge = '<span class="badge badge-success">Done' +
                            (t.completed_at ? ' &middot; ' + formatDate(t.completed_at, { month: 'short', day: 'numeric' }) : '') + '</span>';
                    } else if (t.assignee_role === 'admin') {
                        iconCls = 'background:#fef3c7;color:#b45309;';
                        iconFa = 'fa-user-shield';
                        badge = '<span class="badge badge-warning"><i class="fas fa-hourglass-half"></i> Waiting for HR / Admin</span>';
                    } else {
                        iconCls = 'background:#e0e7ff;color:#4338ca;';
                        iconFa = 'fa-user';
                        badge = '<span class="badge badge-info">Pending - your action</span>';
                    }
                    let action = '';
                    if (!done && t.assignee_role === 'employee') {
                        action = '<button class="btn btn-primary btn-sm" onclick="openComplete(' + t.id + ', this)" style="flex-shrink:0;"><i class="fas fa-check"></i> Mark Done</button>';
                    }
                    html += '<div class="task-card">' +
                        '<div class="task-icon" style="' + iconCls + '"><i class="fas ' + iconFa + '"></i></div>' +
                        '<div style="flex:1;min-width:0;">' +
                            '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
                                '<span style="font-weight:600;' + (done ? 'text-decoration:line-through;color:var(--text-secondary);' : '') + '">' + escapeHtml(t.title) + '</span>' +
                                badge +
                            '</div>' +
                            (t.description ? '<div style="font-size:.83rem;color:var(--text-secondary);margin-top:4px;line-height:1.5;">' + escapeHtml(t.description) + '</div>' : '') +
                            (done && t.remarks ? '<div style="font-size:.78rem;color:var(--text-secondary);margin-top:4px;"><em>"' + escapeHtml(t.remarks) + '"</em></div>' : '') +
                        '</div>' +
                        action +
                    '</div>';
                });
                html += '</div>';
                if (d.tasks.some(t => t.status !== 'done')) {
                    html += '<div class="card slide-up stagger-3" style="padding:14px 18px;background:var(--bg-light,#f9fafb);margin-top:6px;">' +
                        '<p style="font-size:.82rem;color:var(--text-secondary);line-height:1.6;">' +
                        '<i class="fas fa-lightbulb" style="color:#b45309;margin-right:6px;"></i>' +
                        '<strong>Tip:</strong> Most profile-related tasks are completed from ' +
                        '<a href="/employee/profile" style="color:var(--primary);font-weight:600;">My Profile</a>. ' +
                        'Tasks marked "Waiting for HR / Admin" will be closed by your HR team once they finish their part.</p></div>';
                }
            }

            container.innerHTML = html;
        }

        function openComplete(taskId) {
            currentTaskId = taskId;
            const task = myTasks.find(t => t.id === taskId);
            document.getElementById('completeTaskTitle').textContent = task ? task.title : '';
            document.getElementById('completeRemarks').value = '';
            document.getElementById('completeModal').classList.add('active');
        }

        function closeCompleteModal() {
            document.getElementById('completeModal').classList.remove('active');
            currentTaskId = null;
        }

        async function submitComplete() {
            if (!currentTaskId) return;
            const remarks = document.getElementById('completeRemarks').value.trim();
            const r = await apiCall('/onboarding/tasks/' + currentTaskId + '/complete', 'POST', { remarks });
            if (r && r.success) {
                showToast(r.process_completed ? 'All done - onboarding completed!' : 'Task marked as done', 'success');
                closeCompleteModal();
                loadData();
            } else {
                showToast(r?.message || 'Failed to update task', 'error');
            }
        }
    </script>
</body>
</html>
