    <main class="main-content" id="mainContent">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h2 style="font-size:1.25rem;font-weight:600;">My Attendance</h2>
            </div>

                <button type="button" class="notification-btn" title="Notifications"><i class="fas fa-bell"></i><span class="notification-badge" id="notifBadge" style="display:none;"></span></button>

                <div style="position:relative">

                    </button>

                        <a href="/employee/profile" class="profile-menu-item"><i class="fas fa-user"></i> My Profile</a>

        <div class="page-body">
            <div class="card slide-up stagger-2">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
                    <h3 style="font-weight:600;"><i class="fas fa-history" style="color:var(--info);margin-right:8px;"></i>Attendance History</h3>
                    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                        <div style="display:flex;gap:4px;background:var(--bg-light);border-radius:var(--radius);padding:3px;">
                            <button class="btn btn-sm btn-primary" id="viewToggleList" onclick="setView('list')"><i class="fas fa-list"></i> List</button>
                            <button class="btn btn-sm btn-secondary" id="viewToggleMonth" onclick="setView('month')"><i class="fas fa-calendar-alt"></i> Monthly</button>

                        <select id="filterMonth" class="form-control" style="width:auto;" onchange="loadData()"></select>
                        <input type="number" id="filterYear" class="form-control" style="width:100px;" onchange="loadData()">
                    </div>
                </div>
            <div id="summaryBar" style="margin-bottom:16px;font-size:0.9rem;color:var(--text-secondary);"></div>
            <div id="attStatsBar"></div>
            <div id="tableContainer" style="display:block;">
                    <div style="text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto;"></div></div>
                </div>
                <div id="monthlyContainer" style="display:none;"></div>
            </div>
        </div>
    </main>

    <style>
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        #monthlyContainer { overflow-x: auto; }
        .cal-weekday { text-align: center; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--primary); background: var(--primary-50, #EEF2FF); border-radius: 8px; padding: 7px 0; }
        .cal-cell { border: 1px solid var(--border-light); border-radius: var(--radius); min-height: 74px; padding: 6px; position: relative; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
        .cal-day, .cal-tag, .cal-in { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Month summary cards - one line on desktop, 3x2 on phone */
        .att-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; margin-bottom: 14px; }
        @media (max-width: 768px) { .att-stats-grid { grid-template-columns: repeat(3, 1fr); } }
        .att-stats-grid .stat-card { padding: 10px 12px; margin: 0; }
        .att-stats-grid .stat-info h3 { font-size: 1.05rem; }
        .cal-cell .cal-day { font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; }
        .cal-cell .cal-tag { font-size: 0.62rem; font-weight: 600; border-radius: 4px; padding: 1px 5px; align-self: flex-start; }
        .cal-times { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; font-size: 0.52rem; color: var(--text-secondary); margin-top: 2px; line-height: 1.3; }
        .cal-times b { font-weight: 600; }
        .cal-times .cs { display: none; }
        @media (max-width: 768px) {
            .cal-times { gap: 5px; }
            .cal-times .cf { display: none; }
            .cal-times .cs { display: inline; }
            .cal-times .to { display: none; } /* phone cells: In time is enough */
        }
        .cal-cell.today { outline: 2px solid var(--primary); outline-offset: -1px; }
        .cal-cell.weekoff { background: var(--bg-light); }
        .cal-cell.future { background: transparent; color: var(--text-tertiary); }
        .cal-cell.cal-present { background: #D1FAE5; color: #065F46; }
        .cal-cell.cal-late { background: #FEF3C7; color: #92400E; }
        .cal-cell.cal-half-day { background: #FED7AA; color: #9A3412; }
        .cal-cell.cal-leave { background: #EDE9FE; color: #5B21B6; }
        .cal-cell.cal-absent { background: #FEE2E2; color: #991B1B; }
        .cal-cell.cal-holiday { background: #E0E7FF; color: #3730A3; }
        .dark-mode .cal-cell.cal-present { background: #064E3B; color: #34D399; }
        .dark-mode .cal-cell.cal-late { background: #78350F; color: #FBBF24; }
        .dark-mode .cal-cell.cal-half-day { background: #7C2D12; color: #FDBA74; }
        .dark-mode .cal-cell.cal-leave { background: #4C1D95; color: #C4B5FD; }
        .dark-mode .cal-cell.cal-absent { background: #7F1D1D; color: #F87171; }
        .dark-mode .cal-cell.cal-holiday { background: #312E81; color: #A5B4FC; }
        .cal-legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 14px 0; font-size: 0.78rem; }
        .cal-legend .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
        @media (max-width: 768px) {
            .cal-cell { min-height: 54px; padding: 4px; }
            .cal-cell .cal-tag { font-size: 0.55rem; }
        }
        @media (max-width: 480px) {
            .calendar-grid { gap: 4px; }
            .cal-cell { min-height: 46px; padding: 3px; }
            .cal-cell .cal-day { font-size: 0.7rem; }
            .cal-cell .cal-in { font-size: 0.55rem; }
            .att-stats-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .att-stats-grid .stat-card { padding: 8px 6px; }
            .att-stats-grid .stat-info h3 { font-size: 0.95rem; }
            .att-stats-grid .stat-info p { font-size: 0.62rem; }
            .cal-weekday { font-size: 0.58rem; padding: 5px 0; }
        }
    </style>

    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js"></script>
    <script src="../../js/tickets.js"></script>
    <script>
        const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const shortDayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const fullMonthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

        let currentView = 'month';
        let lastRecords = [];
        let lastHolidays = [];
        let lastLeaveDays = new Set();   // approved-leave YYYY-MM-DD keys
        let leaveClass = {};             // key -> 'paid' | 'lop' (module scope: shared by list + monthly views)
        let lastMonthCounts = null;

        // Expand an approved leave range into per-day keys.
        function expandLeaveDays(startRaw, endRaw) {
            const s = (startRaw || '').split('T')[0];
            const e = (endRaw || '').split('T')[0];
            if (!s || !e) return [];
            const out = [];
            const cur = new Date(s + 'T00:00:00Z');
            const end = new Date(e + 'T00:00:00Z');
            while (cur <= end && out.length < 62) {
                out.push(cur.toISOString().substring(0, 10));
                cur.setUTCDate(cur.getUTCDate() + 1);
            }
            return out;
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!checkAuth()) throw new Error('Not authenticated');
            const select = document.getElementById('filterMonth');
            for (let i = 0; i < 12; i++) {
                const opt = document.createElement('option');
                opt.value = i + 1;
                opt.textContent = monthNames[i];
                select.appendChild(opt);
            }
            const now = new Date();
            select.value = now.getMonth() + 1;
            document.getElementById('filterYear').value = now.getFullYear();
            // Open on the visual month grid - it communicates the month at a
            // glance far better than the row list.
            setView('month');
            loadData();
        });

        function setView(view) {
            currentView = view;
            const listBtn = document.getElementById('viewToggleList');
            const monthBtn = document.getElementById('viewToggleMonth');
            listBtn.className = 'btn btn-sm ' + (view === 'list' ? 'btn-primary' : 'btn-secondary');
            monthBtn.className = 'btn btn-sm ' + (view === 'month' ? 'btn-primary' : 'btn-secondary');
            document.getElementById('tableContainer').style.display = view === 'list' ? 'block' : 'none';
            document.getElementById('monthlyContainer').style.display = view === 'month' ? 'block' : 'none';
            if (view === 'month') renderMonthlyView();
        }

        async function loadData() {
            const month = document.getElementById('filterMonth').value;
            const year = document.getElementById('filterYear').value;
            const container = document.getElementById('tableContainer');

            // Day-keyed cache paints the page instantly on revisit; the
            // network call below keeps it accurate right after.
            const cacheKey = 'garchitects_att_' + month + '_' + year + '_' + getTodayIST();
            let cached = null;
            try { cached = JSON.parse(localStorage.getItem(cacheKey) || 'null'); } catch (e) { cached = null; }
            if (cached && Array.isArray(cached.records)) {
                lastRecords = cached.records;
                lastHolidays = cached.holidays || [];
                lastLeaveDays = new Set();
                applyAttendanceData(month, year);
            }

            const [attRes, holRes, lvRes] = await Promise.all([
                apiCall(`/attendance/my?month=${month}&year=${year}`),
                apiCall('/holidays?year=' + year),
                apiCall('/leave/my')
            ]);
            const records = (attRes && attRes.success) ? (attRes.attendance || []) : [];
            lastRecords = records;
            lastHolidays = (holRes && holRes.success) ? (holRes.holidays || []) : [];
            lastLeaveDays = new Set();
            if (lvRes && lvRes.success) {
                (lvRes.leaves || []).forEach(l => {
                    if (l.status !== 'approved') return;
                    expandLeaveDays(l.start_date, l.end_date).forEach(k => lastLeaveDays.add(k));
                });
            }
            try { localStorage.setItem(cacheKey, JSON.stringify({ records, holidays: lastHolidays })); } catch (e) { /* ignore quota */ }
            applyAttendanceData(month, year);
        }

        function applyAttendanceData(month, year) {
            const records = lastRecords || [];
            const container = document.getElementById('tableContainer');
            const summaryEl = document.getElementById('summaryBar');

            // Month counters - SINGLE PASS over calendar days (no double count).
            // Policy (matches payroll): first approved leave day each month is
            // PAID; anything beyond that is LOP and lands under Absent.
            const counts = { present: 0, late: 0, 'half-day': 0, absent: 0, weekoff: 0, holiday: 0, leave: 0 };
            const holidayMap = {};
            (lastHolidays || []).forEach(h => { const k = (h.date || '').split('T')[0]; if (k) holidayMap[k] = h.name; });
            const statusByDate = {};
            records.forEach(a => { statusByDate[(a.date || '').split('T')[0]] = a; });

            // Classify only this month's approved leave days: first day 'paid', rest 'lop'.
            const monthPrefix = year + '-' + String(month).padStart(2, '0') + '-';
            leaveClass = {};
            Array.from(lastLeaveDays).filter(k => k.startsWith(monthPrefix)).sort().forEach(k => {
                leaveClass[k] = counts.leave < 1 ? 'paid' : 'lop';
                if (leaveClass[k] === 'paid') counts.leave++;
            });

            const daysInMonth = new Date(year, month, 0).getDate();
            const nowD = new Date();
            const selM = parseInt(month, 10);
            const selY = parseInt(year, 10);
            const nowM = nowD.getMonth() + 1;
            const nowY = nowD.getFullYear();
            const isCurrentMonth = selM === nowM && selY === nowY;
            const isFutureMonth = selY > nowY || (selY === nowY && selM > nowM);
            const todayKey = getTodayIST();
            const lastCounted = isFutureMonth ? 0 : (isCurrentMonth ? nowD.getDate() : daysInMonth);
            for (let dd = 1; dd <= lastCounted; dd++) {
                const key = year + '-' + String(month).padStart(2, '0') + '-' + String(dd).padStart(2, '0');
                const rec = statusByDate[key];
                const st = rec ? rec.status : null;
                if (st === 'present') { counts.present++; continue; }
                if (st === 'late') { counts.late++; continue; }
                if (st === 'half-day') { counts['half-day']++; continue; }
                if (holidayMap[key]) { counts.holiday++; continue; }
                const dow = new Date(year, month - 1, dd).getDay();
                if (dow === 0 || dow === 6) { counts.weekoff++; continue; }
                if (leaveClass[key]) {
                    // Approved leave: paid for the monthly quota, LOP beyond it.
                    if (leaveClass[key] === 'paid') { /* counts.leave already tallied */ }
                    else counts.absent++;
                    continue;
                }
                if (key < todayKey) counts.absent++;
            }
            lastMonthCounts = counts;

            const totalPresent = counts.present + counts.late + counts['half-day'] + counts.leave;
            document.getElementById('attStatsBar').innerHTML = buildStatsCardsHtml(counts);
            summaryEl.innerHTML = '<span style="font-weight:500;">Total Present Days (incl. late logins, half days &amp; paid leaves): <strong>' + totalPresent + '</strong> / ' + daysInMonth + ' total days in ' + fullMonthNames[month - 1] + ' ' + year + '</span>';

            if (records.length === 0) {
                showEmptyState(container, 'fa-clock', 'No Records', 'No attendance records for this period');
                document.getElementById('monthlyContainer').innerHTML = '';
                return;
            }

            const todayStr = getTodayIST();
                    let html = '<div class="table-container"><table><thead><tr><th>Date</th><th>Day</th><th>Check In</th><th>Check Out</th><th>Location</th><th>Hours Worked</th><th>Status</th><th>Overtime</th></tr></thead><tbody>';
                    records.forEach(a => {
                        const d = new Date(a.date);
                        const adate = a.date ? a.date.split('T')[0] : '';
                        const isToday = adate === todayStr;
                        const isLate = a.status === 'late';
                        let rowStyle = '';
                        if (isToday) rowStyle = 'background:var(--primary-50);';
                        else if (isLate) rowStyle = 'background:rgba(239,68,68,0.04);';

                        let hoursWorked = '-';
                        if (a.check_in && a.check_out) {
                            const ci = a.check_in.split(':').map(Number);
                            const co = a.check_out.split(':').map(Number);
                            let diffMin = (co[0]*60+co[1]) - (ci[0]*60+ci[1]);
                            const breakLog = (() => { try { return JSON.parse(a.break_log || '[]'); } catch { return []; } })();
                            breakLog.forEach(b => {
                                if (b.start && b.end) {
                                    const bs = b.start.split(':').map(Number);
                                    const be = b.end.split(':').map(Number);
                                    diffMin -= ((be[0]*60+be[1]) - (bs[0]*60+bs[1]));
                                }
                            });
                            if (diffMin < 0) diffMin = 0;
                            if (diffMin > 0) hoursWorked = (diffMin/60).toFixed(1) + 'h';
                        }

                        let locHtml = '-';
                        const loc = a.check_in_location || '';
                        if (loc && loc.includes(',')) {
                            const [lat, lon] = loc.split(',');
                            locHtml = '<a href="https://www.google.com/maps?q=' + encodeURIComponent(lat.trim() + ',' + lon.trim()) + '" target="_blank" rel="noopener" style="color:var(--primary);text-decoration:none;" title="' + escapeHtml(loc) + '"><i class="fas fa-map-marker-alt"></i></a>';
                        } else if (loc) {
                            locHtml = '<span style="font-size:0.75rem;">' + escapeHtml(loc) + '</span>';
                        }

                        html += '<tr style="' + rowStyle + '">';
                        html += '<td>' + formatDate(a.date) + (isToday ? ' <span class="badge badge-primary" style="font-size:0.6rem;">Today</span>' : '') + '</td>';
                        html += '<td>' + dayNames[d.getDay()] + '</td>';
                        html += '<td>' + escapeHtml(a.check_in || '-') + '</td>';
                        html += '<td>' + escapeHtml(a.check_out || '-') + '</td>';
                        html += '<td style="text-align:center;">' + locHtml + '</td>';
                        html += '<td>' + hoursWorked + '</td>';
                        const lvCls = leaveClass[adate];
                        const isLeaveRow = a.status === 'absent' && !!lvCls;
                        const leaveLabel = lvCls === 'lop' ? 'Absent (LOP)' : 'On Leave (Paid)';
                        html += '<td><span class="badge badge-' + (isLeaveRow ? (lvCls === 'lop' ? 'danger' : 'info') : getStatusBadge(a.status)) + '">' + escapeHtml(isLeaveRow ? leaveLabel : getStatusText(a.status)) + '</span></td>';
                        html += '<td>' + formatHours(a.overtime_hours) + '</td>';
                        html += '</tr>';
                    });
                html += '</tbody></table></div>';
                container.innerHTML = html;
            renderMonthlyView();
        }

        function renderMonthlyView() {
            const container = document.getElementById('monthlyContainer');
            const month = parseInt(document.getElementById('filterMonth').value);
            const year = parseInt(document.getElementById('filterYear').value);
            const records = lastRecords || [];
            const holidays = lastHolidays || [];

            const byDate = {};
            records.forEach(a => { byDate[(a.date || '').split('T')[0]] = a; });
            const holidayDates = {};
            holidays.forEach(h => { const d = (h.date || '').split('T')[0]; if (d) holidayDates[d] = h.name; });

            const firstDay = new Date(year, month - 1, 1);
            const lastDay = new Date(year, month, 0).getDate();
            const lead = firstDay.getDay();
            const todayStr = getTodayIST();
            const nowTmp = new Date();
            const nowM2 = nowTmp.getMonth() + 1;
            const nowY2 = nowTmp.getFullYear();
            const isFutureMonthCal = year > nowY2 || (year === nowY2 && month > nowM2);
            const padStart = new Date(year, month - 1, -(lead) + 1);

            let html = '<div class="calendar-grid">';
            shortDayNames.forEach(s => { html += '<div class="cal-weekday">' + s + '</div>'; });

            for (let i = 0; i < lead; i++) {
                const pad = new Date(padStart);
                pad.setDate(pad.getDate() + i);
                html += '<div class="cal-cell weekoff" style="min-height:0;border-style:dashed;opacity:0.4;"><div class="cal-day">' + pad.getDate() + '</div></div>';
            }

            const counts = { present: 0, late: 0, 'half-day': 0, absent: 0, weekoff: 0, holiday: 0, leave: 0 };
            for (let d = 1; d <= lastDay; d++) {
                const date = new Date(year, month - 1, d);
                const dayOfWeek = date.getDay();
                const dateStr = year + '-' + String(month).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                const rec = byDate[dateStr];
                const isToday = dateStr === todayStr;
                const isFuture = isFutureMonthCal || date > new Date();

                let cls = '', tag = '', tagColor = '', checkIn = '', checkOut = '', extra = '';
                // Future month: no counting, just grey cells
                if (isFutureMonthCal) {
                    cls = 'future';
                    html += '<div class="cal-cell ' + cls + (isToday ? ' today' : '') + '"><div class="cal-day">' + d + '</div></div>';
                    continue;
                }
                // A declared holiday always wins over a stale auto-absent row.
                if (rec && !(rec.status === 'absent' && holidayDates[dateStr])) {
                    const status = rec.status;
                    if (status === 'present') { cls = 'cal-present'; tag = 'Present'; counts.present++; }
                    else if (status === 'late') { cls = 'cal-late'; tag = 'Late'; counts.late++; }
                    else if (status === 'half-day') { cls = 'cal-half-day'; tag = 'Half Day'; counts['half-day']++; }
                    else if (status === 'absent' && leaveClass[dateStr]) {
                        // Approved leave: paid within monthly quota, LOP beyond.
                        if (leaveClass[dateStr] === 'paid') { cls = 'cal-leave'; tag = 'On Leave (Paid)'; counts.leave++; }
                        else { cls = 'cal-absent'; tag = 'Absent (LOP)'; counts.absent++; }
                    }
                    else if (status === 'absent') { cls = 'cal-absent'; tag = 'Absent'; counts.absent++; }
                    else { cls = 'cal-weekoff'; tag = status; counts.weekoff++; }
                    const fmtT = (t) => { const m = String(t).match(/(\d{1,2}:\d{2})/); return m ? m[1] : t; };
                    if (rec.check_in) checkIn = fmtT(rec.check_in);
                    if (rec.check_out) checkOut = fmtT(rec.check_out);
                } else if (isFuture) {
                    cls = 'future';
                } else if (holidayDates[dateStr]) {
                    // Holidays must win over weekends: a Sunday holiday should
                    // show its name, not "Week Off".
                    cls = 'cal-holiday'; tag = holidayDates[dateStr]; counts.holiday++;
                } else if (dayOfWeek === 0 || dayOfWeek === 6) {
                    cls = 'cal-weekoff'; tag = 'Week Off'; counts.weekoff++;
                } else if (leaveClass[dateStr]) {
                    // Approved leave with no attendance row yet - never absent.
                    if (leaveClass[dateStr] === 'paid') { cls = 'cal-leave'; tag = 'On Leave (Paid)'; counts.leave++; }
                    else { cls = 'cal-absent'; tag = 'Absent (LOP)'; counts.absent++; }
                } else if (dateStr === todayStr) {
                    // Today before check-in is not an absence yet.
                    cls = 'cal-cell';
                } else {
                    cls = 'cal-absent'; tag = 'Absent'; counts.absent++;
                }

                html += '<div class="cal-cell ' + cls + (isToday ? ' today' : '') + '" title="' + (rec && rec.check_in ? 'Check In: ' + rec.check_in + (rec.check_out ? ' | Check Out: ' + rec.check_out : '') : (holidayDates[dateStr] || '')) + '">';
                html += '<div class="cal-day">' + d + (isToday ? ' <span style="font-size:0.55rem;font-weight:700;color:var(--primary);">TODAY</span>' : '') + '</div>';
                if (tag) html += '<div class="cal-tag">' + escapeHtml(tag) + '</div>';
                if (checkIn || checkOut) {
                    const tspan = (cls, full, short, t) =>
                        '<span class="' + cls + '" style="white-space:nowrap;"><b class="cf">' + full + '</b><b class="cs">' + short + '</b> ' + escapeHtml(t) + '</span>';
                    html += '<div class="cal-times">';
                    if (checkIn) html += tspan('ti', 'Check In', 'In', checkIn);
                    if (checkOut) html += tspan('to', 'Check Out', 'Out', checkOut);
                    html += '</div>';
                }
                html += '</div>';
            }
            html += '</div>';

            container.innerHTML = html;
        }

        // Shared colored summary cards (list + monthly views).
        function buildStatsCardsHtml(counts) {
            const cardColors = {
                present: ['#10B981', '#ECFDF5'],
                late: ['#F59E0B', '#FFFBEB'],
                half: ['#F97316', '#FFF7ED'],
                leave: ['#8B5CF6', '#F5F3FF'],
                absent: ['#EF4444', '#FEF2F2'],
                weekoff: ['#3B82F6', '#EFF6FF'],
                holiday: ['#D946EF', '#FDF4FF']
            };
            const statCard = (val, label, c) => '<div class="stat-card" style="margin:0;border-left:4px solid ' + c[0] + ';background:' + c[1] + ';"><div class="stat-info" style="text-align:center;"><h3 style="color:' + c[0] + ';">' + val + '</h3><p>' + label + '</p></div></div>';
            const presentTotal = counts.present + counts.late + counts['half-day'] + counts.leave;
            let html = '<div class="att-stats-grid">';
            html += statCard(presentTotal, 'Total Present Days', cardColors.present);
            html += statCard(counts.late, 'Late Logins', cardColors.late);
            html += statCard(counts['half-day'], 'Half Days', cardColors.half);
            html += statCard(counts.leave, 'On Leave (Paid)', cardColors.leave);
            html += statCard(counts.absent, 'Absent Days', cardColors.absent);
            html += statCard(counts.weekoff, 'Week Offs', cardColors.weekoff);
            html += statCard(counts.holiday, 'Holidays', cardColors.holiday);
            html += '</div>';
            return html;
        }
    </script>
</body>
</html>
