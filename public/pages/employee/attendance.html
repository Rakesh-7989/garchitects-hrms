        /* Day-detail popup rows */

    <script>
        const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const shortDayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const fullMonthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

        let currentView = 'month';
        let lastRecords = [];
        let lastHolidays = [];
        let lastLeaveDays = new Set();   // approved-leave YYYY-MM-DD keys
        let leaveClass = {};             // key -> 'paid' | 'lop' (module scope: shared by list + monthly views)
        let lastMonthCounts = null;

        // Expand an approved leave range into per-day keys.
        function expandLeaveDays(startRaw, endRaw) {
            const s = (startRaw || '').split('T')[0];
            const e = (endRaw || '').split('T')[0];
            if (!s || !e) return [];
            const out = [];
            const cur = new Date(s + 'T00:00:00Z');
            const end = new Date(e + 'T00:00:00Z');
            while (cur <= end && out.length < 62) {
                out.push(cur.toISOString().substring(0, 10));
                cur.setUTCDate(cur.getUTCDate() + 1);
            }
            return out;
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!checkAuth()) throw new Error('Not authenticated');
            const select = document.getElementById('filterMonth');
            for (let i = 0; i < 12; i++) {
                const opt = document.createElement('option');
                opt.value = i + 1;
                opt.textContent = monthNames[i];
                select.appendChild(opt);
            }
            const now = new Date();
            select.value = now.getMonth() + 1;
            document.getElementById('filterYear').value = now.getFullYear();
            // Open on the visual month grid - it communicates the month at a
            // glance far better than the row list.
            setView('month');
            loadData();
        });

        function setView(view) {
            currentView = view;
            const listBtn = document.getElementById('viewToggleList');
            const monthBtn = document.getElementById('viewToggleMonth');
            listBtn.className = 'btn btn-sm ' + (view === 'list' ? 'btn-primary' : 'btn-secondary');
            monthBtn.className = 'btn btn-sm ' + (view === 'month' ? 'btn-primary' : 'btn-secondary');
            document.getElementById('tableContainer').style.display = view === 'list' ? 'block' : 'none';
            document.getElementById('monthlyContainer').style.display = view === 'month' ? 'block' : 'none';
            if (view === 'month') renderMonthlyView();
        }

        async function loadData() {
            const month = document.getElementById('filterMonth').value;
            const year = document.getElementById('filterYear').value;
            const container = document.getElementById('tableContainer');

            // Day-keyed cache paints the page instantly on revisit; the
            // network call below keeps it accurate right after.
            const cacheKey = 'garchitects_att_' + month + '_' + year + '_' + getTodayIST();
            let cached = null;
            try { cached = JSON.parse(localStorage.getItem(cacheKey) || 'null'); } catch (e) { cached = null; }
            if (cached && Array.isArray(cached.records)) {
                lastRecords = cached.records;
                lastHolidays = cached.holidays || [];
                lastLeaveDays = new Set();
                applyAttendanceData(month, year);
            }

            const [attRes, holRes, lvRes] = await Promise.all([
                apiCall(`/attendance/my?month=${month}&year=${year}`),
                apiCall('/holidays?year=' + year),
                apiCall('/leave/my')
            ]);
            // Three-way branch (MI-2): null = network/timeout failure,
            // success === false = server error - either is an ERROR card
            // with Retry, never "No attendance records for this period".
            // Only a real success with zero rows is the genuine empty state.
            // Soft fallback: if nothing was ever rendered (no cache) and the
            // fetch fails, show a neutral empty state + toast instead of
            // blocking the UI with a hard error (cold-start resilience).
            if (!attRes || attRes.success === false) {
                const hadCache = cached && Array.isArray(cached.records);
                if (!hadCache) {
                    lastRecords = [];
                    lastHolidays = [];
                    lastLeaveDays = new Set();
                    applyAttendanceData(month, year);
                    const errMsg = (attRes && attRes.message) || 'Could not load your attendance records.';
                    showToast(errMsg + ' — showing empty view. Tap Retry if needed.', 'info');
                    return;
                }
                const errMsg = (attRes && attRes.message) || 'Could not load your attendance records.';
                showLoadError(container, errMsg, 'loadData');
                showLoadError(document.getElementById('monthlyContainer'), errMsg, 'loadData');
                document.getElementById('summaryBar').innerHTML = '';
                document.getElementById('attStatsBar').innerHTML = '';
                return;
            }
            const records = attRes.attendance || [];
            lastRecords = records;
            lastHolidays = (holRes && holRes.success) ? (holRes.holidays || []) : [];
            lastLeaveDays = new Set();
            if (lvRes && lvRes.success) {
                (lvRes.leaves || []).forEach(l => {
                    if (l.status !== 'approved') return;
                    expandLeaveDays(l.start_date, l.end_date).forEach(k => lastLeaveDays.add(k));
                });
            }
            try { localStorage.setItem(cacheKey, JSON.stringify({ records, holidays: lastHolidays })); } catch (e) { /* ignore quota */ }
            applyAttendanceData(month, year);
        }

        function applyAttendanceData(month, year) {
            const records = lastRecords || [];
            const container = document.getElementById('tableContainer');
            const summaryEl = document.getElementById('summaryBar');
            renderMissedCheckouts(records);

            // Month counters - SINGLE PASS over calendar days (no double count).
            // Policy (matches payroll): the first `monthly_leave_quota` approved
            // leave days each month are PAID; anything beyond that is LOP and
            // lands under Absent.
            const counts = { present: 0, late: 0, 'half-day': 0, absent: 0, weekoff: 0, holiday: 0, leave: 0, wfh: 0 };
            const holidayMap = {};
            (lastHolidays || []).forEach(h => { const k = (h.date || '').split('T')[0]; if (k) holidayMap[k] = h.name; });
            const dateKey = (v) => {
                if (!v) return '';
                const s = String(v).trim();
                const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
                if (m) return m[1] + '-' + m[2] + '-' + m[3];
                if (s.includes('T')) return s.split('T')[0];
                return s.slice(0, 10);
            };
            const statusByDate = {};
            const byDate = {};
            records.forEach(a => {
                const k = dateKey(a.date);
                if (k) {
                    statusByDate[k] = a;
                    byDate[k] = a;
                }
            });

            // Classify only this month's approved leave days: first `quota`
            // days 'paid', rest 'lop'. Quota comes from the configured
            // monthly_leave_quota (default 1), matching payroll.
            const monthPrefix = year + '-' + String(month).padStart(2, '0') + '-';
            const quota = window.workWeek ? window.workWeek.monthlyLeaveQuota : 1;
            leaveClass = {};
            Array.from(lastLeaveDays).filter(k => k.startsWith(monthPrefix)).sort().forEach(k => {
                leaveClass[k] = counts.leave < quota ? 'paid' : 'lop';
                if (leaveClass[k] === 'paid') counts.leave++;
            });

            const daysInMonth = new Date(year, month, 0).getDate();
            const nowD = new Date();
            const selM = parseInt(month, 10);
            const selY = parseInt(year, 10);
            const nowM = nowD.getMonth() + 1;
            const nowY = nowD.getFullYear();
            const isCurrentMonth = selM === nowM && selY === nowY;
            const isFutureMonth = selY > nowY || (selY === nowY && selM > nowM);
            const todayKey = getTodayIST();
            const lastCounted = isFutureMonth ? 0 : (isCurrentMonth ? nowD.getDate() : daysInMonth);
            for (let dd = 1; dd <= lastCounted; dd++) {
                const key = year + '-' + String(month).padStart(2, '0') + '-' + String(dd).padStart(2, '0');
                const rec = statusByDate[key];
                const st = rec ? rec.status : null;
                if (st === 'present') { counts.present++; continue; }
                if (st === 'late') { counts.late++; continue; }
                if (st === 'half-day') { counts['half-day']++; continue; }
                // Work From Home is a WORKING day (approved WFH writes a 'wfh'
                // row). It must never fall through to the absent tally.
                if (st === 'wfh') { counts.wfh++; continue; }
                if (holidayMap[key]) { counts.holiday++; continue; }
                const dow = new Date(year, month - 1, dd).getDay();
                if (window.workWeek ? window.workWeek.isWeekOff(new Date(year, month - 1, dd)) : (dow === 0 || dow === 6)) { counts.weekoff++; continue; }
                if (leaveClass[key]) {
                    // Approved leave: paid for the monthly quota, LOP beyond it.
                    if (leaveClass[key] === 'paid') { /* counts.leave already tallied */ }
                    else counts.absent++;
                    continue;
                }
                if (key < todayKey) counts.absent++;
            }
            lastMonthCounts = counts;

            const totalPresent = counts.present + counts.late + counts['half-day'] + counts.leave + counts.wfh;
            document.getElementById('attStatsBar').innerHTML = buildStatsCardsHtml(counts);
            summaryEl.innerHTML = '<span style="font-weight:500;">Total Present Days (incl. late logins, half days, WFH &amp; paid leaves): <strong>' + totalPresent + '</strong> / ' + daysInMonth + ' total days in ' + fullMonthNames[month - 1] + ' ' + year + '</span>';

            if (records.length === 0) {
                showEmptyState(container, 'fa-clock', 'No Records', 'No attendance records for this period');
                document.getElementById('monthlyContainer').innerHTML = '';
                return;
            }

            const todayStr = getTodayIST();
                    let html = '<div class="table-container"><table><thead><tr><th>Date</th><th>Day</th><th>Check In</th><th>Check Out</th><th>Location</th><th>Hours Worked</th><th>Status</th></tr></thead><tbody>';
                    records.forEach(a => {
                        // a.date is a plain YYYY-MM-DD (server-normalized):
                        // parse it at UTC midnight and read the weekday with
                        // getUTCDay() so the Day column is the date's true
                        // weekday in every browser timezone - new Date(date)
                        // + getDay() would be browser-TZ-dependent (MI-5).
                        const dm = String(a.date || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
                        const d = dm ? new Date(Date.UTC(Number(dm[1]), Number(dm[2]) - 1, Number(dm[3]))) : new Date(a.date);
                        const adate = dateKey(a.date);
                        const isToday = adate === todayStr;
                        const isLate = a.status === 'late';
                        let rowStyle = '';
                        if (isToday) rowStyle = 'background:var(--primary-50);';
                        else if (isLate) rowStyle = 'background:rgba(239,68,68,0.04);';

                        let hoursWorked = '-';
                        // Today's live row (checked in, not yet out) gets a
                        // running count too - an employee mid-day wants their
                        // current hours, not a bare '-'. Completed days keep the
                        // exact calc below; live ones are prefixed '~'.
                        if (a.check_in && (a.check_out || isToday)) {
                            const ci = a.check_in.split(':').map(Number);
                            const co = a.check_out ? a.check_out.split(':').map(Number) : [nowD.getHours(), nowD.getMinutes()];
                            let diffMin = (co[0]*60+co[1]) - (ci[0]*60+ci[1]);
                            const breakLog = (() => { try { return JSON.parse(a.break_log || '[]'); } catch { return []; } })();
                            breakLog.forEach(b => {
                                if (b.start && b.end) {
                                    const bs = b.start.split(':').map(Number);
                                    const be = b.end.split(':').map(Number);
                                    diffMin -= ((be[0]*60+be[1]) - (bs[0]*60+bs[1]));
                                }
                            });
                            // Legacy rows can still carry an open break on a
                            // completed day (started but never ended before
                            // check-out/auto-checkout). Count it up to check-out
                            // (or to now, for today's live break) so Hours Worked
                            // is honest.
                            if (a.break_start && !a.break_end) {
                                const bs = String(a.break_start).split(':').map(Number);
                                const refEnd = a.check_out ? co : [nowD.getHours(), nowD.getMinutes()];
                                diffMin -= ((refEnd[0]*60+refEnd[1]) - (bs[0]*60+bs[1]));
                            }
                            if (diffMin < 0) diffMin = 0;
                            if (diffMin > 0) hoursWorked = (a.check_out ? '' : '~') + (diffMin/60).toFixed(1) + 'h';
                        }

                        let locHtml = '-';
                        const loc = a.check_in_location || '';
                        if (loc && loc.includes(',')) {
                            const [lat, lon] = loc.split(',');
                            locHtml = '<a href="https://www.google.com/maps?q=' + encodeURIComponent(lat.trim() + ',' + lon.trim()) + '" target="_blank" rel="noopener" style="color:var(--primary);text-decoration:none;" title="' + escapeHtml(loc) + '"><i class="fas fa-map-marker-alt"></i></a>';
                        } else if (loc) {
                            locHtml = '<span style="font-size:0.75rem;">' + escapeHtml(loc) + '</span>';
                        }

                        html += '<tr style="cursor:pointer;' + rowStyle + '" onclick="openDayDetail(\'' + adate + '\')">';
                        html += '<td>' + formatDate(a.date) + (isToday ? ' <span class="badge badge-primary" style="font-size:0.6rem;">Today</span>' : '') + '</td>';
                        html += '<td>' + dayNames[d.getUTCDay()] + '</td>';
                        html += '<td>' + escapeHtml(a.check_in || '-') + '</td>';
                        html += '<td>' + escapeHtml(a.check_out || '-') + '</td>';
                        html += '<td style="text-align:center;">' + locHtml + '</td>';
                        html += '<td>' + hoursWorked + '</td>';
                        const lvCls = leaveClass[adate];
                        const isLeaveRow = a.status === 'absent' && !!lvCls;
                        const leaveLabel = lvCls === 'lop' ? 'Absent (LOP)' : 'On Leave (Paid)';
                        html += '<td><span class="badge badge-' + (isLeaveRow ? (lvCls === 'lop' ? 'danger' : 'info') : getStatusBadge(a.status)) + '">' + escapeHtml(isLeaveRow ? leaveLabel : getStatusText(a.status)) + '</span>' + (a.auto_checkout ? ' <span class="badge badge-warning" style="font-size:0.6rem;" title="No check-out by the grace deadline — auto-closed">Auto</span>' : '') + '</td>';
                        html += '</tr>';
                    });
                html += '</tbody></table></div>';
                container.innerHTML = html;
            renderMonthlyView();
        }

        // Auto-checkout ("missed checkout") banner. Each auto-closed day that is
        // still missing the employee's reason gets an inline input so it can be
        // explained in place.
        function renderMissedCheckouts(records) {
            const el = document.getElementById('missedCheckoutBanner');
            if (!el) return;
            const missed = (records || []).filter(a => a.auto_checkout && !a.checkout_miss_reason);
            if (missed.length === 0) { el.style.display = 'none'; el.innerHTML = ''; return; }
            const rows = missed.map(a => {
                const d = String(a.date || '').split('T')[0];
                const co = (a.check_out || '').toString().slice(0, 5);
                return '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--border-light);">' +
                    '<div style="min-width:150px;"><strong>' + escapeHtml(d) + '</strong>' +
                    '<div style="font-size:0.75rem;color:var(--text-secondary);">Auto checked out at ' + escapeHtml(co || '-') + ' · half-day</div></div>' +
                    '<input type="text" class="form-control" id="missReason_' + a.id + '" maxlength="500" placeholder="Why could you not check out?" style="flex:1;min-width:220px;">' +
                    '<button class="btn btn-sm btn-primary" onclick="submitMissReason(' + a.id + ')"><i class="fas fa-paper-plane"></i> Save reason</button>' +
                '</div>';
            }).join('');
            el.style.display = 'block';
            el.innerHTML = '<div class="card" style="border-left:4px solid var(--warning);padding:16px 18px;">' +
                '<div style="font-weight:600;margin-bottom:4px;"><i class="fas fa-triangle-exclamation" style="color:var(--warning);margin-right:8px;"></i>Missed checkouts need a reason</div>' +
                '<div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:8px;">These days had no check-out, so they were auto-closed at the grace deadline and marked <strong>half-day</strong>. Please record why — it is saved with your attendance.</div>' +
                rows + '</div>';
        }

        async function submitMissReason(attendanceId) {
            const input = document.getElementById('missReason_' + attendanceId);
            const reason = input ? input.value.trim() : '';
            if (!reason) { showToast('Please enter a reason', 'error'); return; }
            const r = await apiCall('/attendance/miss-reason', 'POST', { attendance_id: attendanceId, reason });
            if (r && r.success) {
                showToast('Reason recorded', 'success');
                loadData();
            } else {
                showToast((r && r.message) || 'Could not save the reason', 'error');
            }
        }

        function renderMonthlyView() {
            const container = document.getElementById('monthlyContainer');
            const month = parseInt(document.getElementById('filterMonth').value);
            const year = parseInt(document.getElementById('filterYear').value);
            const records = lastRecords || [];
            const holidays = lastHolidays || [];

            const byDate = {};
            records.forEach(a => { byDate[(a.date || '').split('T')[0]] = a; });
            const holidayDates = {};
            holidays.forEach(h => { const d = (h.date || '').split('T')[0]; if (d) holidayDates[d] = h.name; });

            const firstDay = new Date(year, month - 1, 1);
            const lastDay = new Date(year, month, 0).getDate();
            const lead = firstDay.getDay();
            const todayStr = getTodayIST();
            const nowTmp = new Date();
            const nowM2 = nowTmp.getMonth() + 1;
            const nowY2 = nowTmp.getFullYear();
            const isFutureMonthCal = year > nowY2 || (year === nowY2 && month > nowM2);
            const padStart = new Date(year, month - 1, -(lead) + 1);

            let html = '<div class="calendar-grid">';
            shortDayNames.forEach(s => { html += '<div class="cal-weekday">' + s + '</div>'; });

            for (let i = 0; i < lead; i++) {
                const pad = new Date(padStart);
                pad.setDate(pad.getDate() + i);
                html += '<div class="cal-cell weekoff" style="min-height:0;border-style:dashed;opacity:0.4;"><div class="cal-day">' + pad.getDate() + '</div></div>';
            }

            const counts = { present: 0, late: 0, 'half-day': 0, absent: 0, weekoff: 0, holiday: 0, leave: 0, wfh: 0 };
            for (let d = 1; d <= lastDay; d++) {
                const date = new Date(year, month - 1, d);
                const dayOfWeek = date.getDay();
                const dateStr = year + '-' + String(month).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                const rec = byDate[dateStr];
                const isToday = dateStr === todayStr;
                const isFuture = isFutureMonthCal || date > new Date();

                let cls = '', tag = '', tagColor = '', checkIn = '', checkOut = '', extra = '';
                // Future month: no counting, just grey cells
                if (isFutureMonthCal) {
                    cls = 'future';
                    html += '<div class="cal-cell clickable ' + cls + (isToday ? ' today' : '') + '" onclick="openDayDetail(\'' + dateStr + '\')"><div class="cal-day">' + d + '</div></div>';
                    continue;
                }
                // A declared holiday always wins over a stale auto-absent row.
                if (rec && !(rec.status === 'absent' && holidayDates[dateStr])) {
                    const status = rec.status;
                    if (status === 'present') { cls = 'cal-present'; tag = 'Present'; counts.present++; }
                    else if (status === 'late') { cls = 'cal-late'; tag = 'Late'; counts.late++; }
                    else if (status === 'half-day') { cls = 'cal-half-day'; tag = 'Half Day'; counts['half-day']++; }
                    else if (status === 'wfh') { cls = 'cal-wfh'; tag = 'Work From Home'; counts.wfh++; }
                    else if (status === 'absent' && leaveClass[dateStr]) {
                        // Approved leave: paid within monthly quota, LOP beyond.
                        if (leaveClass[dateStr] === 'paid') { cls = 'cal-leave'; tag = 'On Leave (Paid)'; counts.leave++; }
                        else { cls = 'cal-absent'; tag = 'Absent (LOP)'; counts.absent++; }
                    }
                    else if (status === 'absent') { cls = 'cal-absent'; tag = 'Absent'; counts.absent++; }
                    else { cls = 'cal-weekoff'; tag = status; counts.weekoff++; }
                    const fmtT = (t) => { const m = String(t).match(/(\d{1,2}:\d{2})/); return m ? m[1] : t; };
                    if (rec.check_in) checkIn = fmtT(rec.check_in);
                    if (rec.check_out) checkOut = fmtT(rec.check_out);
                } else if (isFuture) {
                    cls = 'future';
                } else if (holidayDates[dateStr]) {
                    // Holidays must win over the weekly off: a holiday on the
                    // week off day should show its name, not "Week Off".
                    cls = 'cal-holiday'; tag = holidayDates[dateStr]; counts.holiday++;
                } else if (window.workWeek ? window.workWeek.isWeekOff(date) : (dayOfWeek === 0 || dayOfWeek === 6)) {
                    cls = 'cal-weekoff'; tag = 'Week Off'; counts.weekoff++;
                } else if (leaveClass[dateStr]) {
                    // Approved leave with no attendance row yet - never absent.
                    if (leaveClass[dateStr] === 'paid') { cls = 'cal-leave'; tag = 'On Leave (Paid)'; counts.leave++; }
                    else { cls = 'cal-absent'; tag = 'Absent (LOP)'; counts.absent++; }
                } else if (dateStr === todayStr) {
                    // Today before check-in is not an absence yet.
                    cls = 'cal-cell';
                } else {
                    cls = 'cal-absent'; tag = 'Absent'; counts.absent++;
                }

                html += '<div class="cal-cell clickable ' + cls + (isToday ? ' today' : '') + '" onclick="openDayDetail(\'' + dateStr + '\')" title="' + (rec && rec.check_in ? 'Check In: ' + rec.check_in + (rec.check_out ? ' | Check Out: ' + rec.check_out : '') : (holidayDates[dateStr] || '')) + '">';
                html += '<div class="cal-day">' + d + (isToday ? ' <span style="font-size:0.55rem;font-weight:700;color:var(--primary);">TODAY</span>' : '') + '</div>';
                if (tag) html += '<div class="cal-tag">' + escapeHtml(tag) + '</div>';
                if (checkIn || checkOut) {
                    const tspan = (cls, full, short, t) =>
                        '<span class="' + cls + '" style="white-space:nowrap;"><b class="cf">' + full + '</b><b class="cs">' + short + '</b> ' + escapeHtml(t) + '</span>';
                    html += '<div class="cal-times">';
                    if (checkIn) html += tspan('ti', 'Check In', 'In', checkIn);
                    if (checkOut) html += tspan('to', 'Check Out', 'Out', checkOut);
                    html += '</div>';
                }
                html += '</div>';
            }
            html += '</div>';

            container.innerHTML = html;
        }

        // ---- Day detail popup ----------------------------------------------
        // Clicking any calendar cell or history row opens this: exactly that
        // day's check-in / check-out / status / hours / break / location, plus
        // the day kind (leave, WFH, holiday, week off) and flags (auto
        // check-out + miss reason, regularized).
        function normDate(v) {
            if (!v) return '';
            const s = String(v).trim();
            const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (m) return m[1] + '-' + m[2] + '-' + m[3];
            if (s.includes('T')) return s.split('T')[0];
            return s.slice(0, 10);
        }

        function ddFmtTime(t) {
            const m = String(t || '').match(/(\d{1,2}:\d{2})/);
            return m ? m[1] : (t || '');
        }

        function dayHoursWorked(a) {
            if (!a || !a.check_in) return null;
            const isToday = normDate(a.date) === getTodayIST();
            if (!a.check_out && !isToday) return null;
            const nowD = new Date();
            const ci = String(a.check_in).split(':').map(Number);
            const co = a.check_out ? String(a.check_out).split(':').map(Number) : [nowD.getHours(), nowD.getMinutes()];
            let diffMin = (co[0] * 60 + co[1]) - (ci[0] * 60 + ci[1]);
            let breakMin = 0;
            const breakLog = (() => { try { return JSON.parse(a.break_log || '[]'); } catch { return []; } })();
            breakLog.forEach(b => {
                if (b.start && b.end) {
                    const bs = String(b.start).split(':').map(Number);
                    const be = String(b.end).split(':').map(Number);
                    breakMin += Math.max(0, ((be[0] * 60 + be[1]) - (bs[0] * 60 + bs[1])));
                }
            });
            if (a.break_start && !a.break_end) {
                const bs = String(a.break_start).split(':').map(Number);
                const refEnd = a.check_out ? co : [nowD.getHours(), nowD.getMinutes()];
                breakMin += Math.max(0, ((refEnd[0] * 60 + refEnd[1]) - (bs[0] * 60 + bs[1])));
            }
            diffMin -= breakMin;
            if (diffMin < 0) diffMin = 0;
            return { workMin: diffMin, breakMin: breakMin, live: !a.check_out };
        }

        function openDayDetail(dateStr) {
            if (!dateStr) return;
            const rec = (lastRecords || []).find(r => normDate(r.date) === dateStr) || null;
            const holName = ((lastHolidays || []).find(h => normDate(h.date) === dateStr) || {}).name || null;
            const leave = leaveClass[dateStr] || null;
            const dm = String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})/);
            const dow = dm ? new Date(Date.UTC(Number(dm[1]), Number(dm[2]) - 1, Number(dm[3]))).getUTCDay() : new Date(dateStr).getDay();
            const isToday = dateStr === getTodayIST();
            const isFuture = dateStr > getTodayIST();
            const isWeekOff = window.workWeek ? window.workWeek.isWeekOff(new Date(dateStr + 'T00:00:00')) : (dow === 0);

            document.getElementById('dayDetailTitle').innerHTML = '<i class="fas fa-calendar-day" style="color:var(--primary);margin-right:8px;"></i>'
                + dayNames[dow] + ', ' + formatDate(dateStr) + (isToday ? ' (Today)' : '');

            const row = (lbl, val) => '<div class="day-detail-row"><span class="lbl">' + lbl + '</span><span class="val">' + val + '</span></div>';
            let rows = '';

            let statusBadge;
            if (rec) {
                if (rec.status === 'absent' && leave) {
                    statusBadge = leave === 'lop'
                        ? '<span class="badge badge-danger">Absent (LOP)</span>'
                        : '<span class="badge badge-info">On Leave (Paid)</span>';
                } else {
                    statusBadge = '<span class="badge badge-' + getStatusBadge(rec.status) + '">' + escapeHtml(getStatusText(rec.status)) + '</span>';
                }
            } else if (holName) statusBadge = '<span class="badge badge-info">Holiday</span>';
            else if (leave) statusBadge = '<span class="badge badge-' + (leave === 'lop' ? 'danger' : 'info') + '">' + (leave === 'lop' ? 'Absent (LOP)' : 'On Leave (Paid)') + '</span>';
            else if (isWeekOff) statusBadge = '<span class="badge badge-secondary">Week Off</span>';
            else if (isFuture) statusBadge = '<span class="badge badge-secondary">Upcoming</span>';
            else if (isToday) statusBadge = '<span class="badge badge-secondary">Not checked in yet</span>';
            else statusBadge = '<span class="badge badge-danger">Absent</span>';

            rows += row('Status', statusBadge);

            if (rec) {
                rows += row('Check In', rec.check_in ? '<span style="color:var(--success);">' + escapeHtml(ddFmtTime(rec.check_in)) + '</span>' : '-');
                rows += row('Check Out', rec.check_out ? '<span style="color:var(--danger);">' + escapeHtml(ddFmtTime(rec.check_out)) + '</span>' : '<span style="color:var(--text-secondary);">Not yet</span>');
                const hw = dayHoursWorked(rec);
                rows += row('Hours Worked', hw ? (hw.live ? '~' : '') + (hw.workMin / 60).toFixed(1) + 'h' : '-');
                if (hw && hw.breakMin > 0) rows += row('Break', (hw.breakMin / 60).toFixed(1) + 'h');
                if (rec.check_in_location) {
                    const loc = String(rec.check_in_location);
                    let locVal = escapeHtml(loc);
                    if (loc.includes(',')) {
                        const [lat, lon] = loc.split(',');
                        locVal = '<a href="https://www.google.com/maps?q=' + encodeURIComponent(lat.trim() + ',' + lon.trim()) + '" target="_blank" rel="noopener" style="color:var(--primary);text-decoration:none;"><i class="fas fa-map-marker-alt"></i> View on Map</a>';
                    }
                    rows += row('Location', locVal);
                }
                if (rec.auto_checkout) {
                    rows += row('Auto check-out', '<span class="badge badge-warning">Yes</span>');
                    if (rec.checkout_miss_reason) rows += row('Miss reason', escapeHtml(rec.checkout_miss_reason));
                }
                if (rec.remarks && String(rec.remarks).includes('[regularized]')) rows += row('Note', '<span class="badge badge-info">Regularized</span>');
            } else if (holName) rows += row('Holiday', escapeHtml(holName));
            else if (leave) rows += row('Leave', leave === 'lop' ? 'Loss of Pay' : 'Paid');
            else if (isWeekOff) rows += row('Day type', 'Weekly Off');
            else if (isFuture) rows += row('Day type', 'Upcoming');
            else if (isToday) rows += row('Day type', 'Not checked in yet');
            else rows += row('Record', 'No attendance recorded');

            document.getElementById('dayDetailBody').innerHTML = rows;
            document.getElementById('dayDetailModal').classList.add('active');
        }

        function closeDayDetail() {
            document.getElementById('dayDetailModal').classList.remove('active');
        }

        // Shared colored summary cards (list + monthly views).
        function buildStatsCardsHtml(counts) {
            const cardColors = {
                present: ['#10B981', '#ECFDF5'],
                late: ['#F59E0B', '#FFFBEB'],
                half: ['#F97316', '#FFF7ED'],
                leave: ['#8B5CF6', '#F5F3FF'],
                absent: ['#EF4444', '#FEF2F2'],
                weekoff: ['#3B82F6', '#EFF6FF'],
                holiday: ['#D946EF', '#FDF4FF'],
                wfh: ['#0EA5E9', '#F0F9FF']
            };
            const statCard = (val, label, c) => '<div class="stat-card" style="margin:0;border-left:4px solid ' + c[0] + ';background:' + c[1] + ';"><div class="stat-info" style="text-align:center;"><h3 style="color:' + c[0] + ';">' + val + '</h3><p>' + label + '</p></div></div>';
            const presentTotal = counts.present + counts.late + counts['half-day'] + counts.leave + (counts.wfh || 0);
            let html = '<div class="att-stats-grid">';
            html += statCard(presentTotal, 'Total Present Days', cardColors.present);
            html += statCard(counts.late, 'Late Logins', cardColors.late);
            html += statCard(counts['half-day'], 'Half Days', cardColors.half);
            html += statCard(counts.wfh || 0, 'Work From Home', cardColors.wfh);
            html += statCard(counts.leave, 'On Leave (Paid)', cardColors.leave);
            html += statCard(counts.absent, 'Absent Days', cardColors.absent);
            html += statCard(counts.weekoff, 'Week Offs', cardColors.weekoff);
            html += statCard(counts.holiday, 'Holidays', cardColors.holiday);
            html += '</div>';
            return html;
        }
    </script>
