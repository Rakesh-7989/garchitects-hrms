<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Holidays - G-Architects HRMS</title>
    <link rel="icon" type="image/png" href="../../assets/images/fav-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .next-holiday-card { display: flex; align-items: center; gap: 20px; padding: 24px; background: linear-gradient(135deg, var(--primary) 0%, #7C3AED 100%); color: white; border-radius: var(--radius-md); flex-wrap: wrap; }
        .next-holiday-card .holiday-icon { width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
        .next-holiday-card .holiday-info { flex: 1; min-width: 160px; }
        .next-holiday-card .holiday-info h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
        .next-holiday-card .holiday-info p { opacity: 0.9; font-size: 0.9rem; }
        .section-title { font-weight: 600; font-size: 1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .past-row { opacity: 0.55; }
        .past-row:hover { opacity: 0.75; }
    </style>
</head>
<body class="employee-app">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo"><i class="fas fa-building" style="color:var(--primary-light);font-size:1.5rem;"></i><span style="font-size:1rem;font-weight:700;">G-Architects HRMS</span></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Main</div>
            <a href="/employee/dashboard" class="nav-item"><i class="fas fa-tachometer-alt"></i><span class="nav-text">Dashboard</span></a>
            <a href="/manager/my-team" id="myTeamLink" style="display:none;" class="nav-item"><i class="fas fa-users"></i><span class="nav-text">My Team</span></a>
            <div class="nav-section-title">My Info</div>
            <a href="/employee/profile" class="nav-item"><i class="fas fa-user"></i><span class="nav-text">My Profile</span></a>
            <a href="/employee/onboarding" class="nav-item"><i class="fas fa-user-plus"></i><span class="nav-text">My Onboarding</span></a>
            <a href="/employee/my-projects" class="nav-item"><i class="fas fa-project-diagram"></i><span class="nav-text">My Projects</span></a>
            <a href="/employee/my-work" class="nav-item"><i class="fas fa-list-check"></i><span class="nav-text">My Work</span></a>
            <a href="/employee/attendance" class="nav-item"><i class="fas fa-clock"></i><span class="nav-text">Attendance</span></a>
            <a href="/employee/regularization" class="nav-item"><i class="fas fa-clock-rotate-left"></i><span class="nav-text">Regularization</span></a>
            <a href="/employee/leave" class="nav-item"><i class="fas fa-calendar-times"></i><span class="nav-text">Leave</span></a>
            <a href="/employee/wfh" class="nav-item"><i class="fas fa-home"></i><span class="nav-text">WFH</span></a>
            <a href="/employee/payslips" class="nav-item"><i class="fas fa-indian-rupee-sign"></i><span class="nav-text">Payslips</span></a>
            <div class="nav-section-title">Company</div>
            <a href="/employee/documents" class="nav-item"><i class="fas fa-file-alt"></i><span class="nav-text">Documents</span></a>
            <a href="/employee/announcements" class="nav-item"><i class="fas fa-bullhorn"></i><span class="nav-text">Announcements</span></a>
            <div class="nav-section-title">Support</div>
            <a href="/employee/holidays" class="nav-item active"><i class="fas fa-calendar-check"></i><span class="nav-text">Holidays</span></a>
            <div class="nav-section-title">Resources</div>
            <a href="/employee/directory" class="nav-item"><i class="fas fa-address-book"></i><span class="nav-text">Directory</span></a>
            <a href="/employee/tickets" class="nav-item"><i class="fas fa-ticket-alt"></i><span class="nav-text">My Queries</span></a>
        </nav>
    </aside>

    <main class="main-content" id="mainContent">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h2 style="font-size:1.25rem;font-weight:600;">Holidays</h2>
            </div>
            <div class="header-right">
                <button type="button" class="notification-btn" title="Notifications"><i class="fas fa-bell"></i><span class="notification-badge" id="notifBadge" style="display:none;"></span></button>
                <button class="notification-btn" onclick="toggleDarkMode()" title="Toggle dark mode"><i class="fas fa-moon" id="themeIcon"></i></button>
                <div style="position:relative">
                    <button class="profile-btn" onclick="toggleProfileMenu()">
                        <span class="profile-photo" id="profilePhoto" style="display:inline-flex;align-items:center;justify-content:center;background:var(--primary);color:white;border-radius:50%;width:36px;height:36px;font-size:0.8rem;font-weight:600;"></span>
                        <span id="profileName" style="margin-left:8px;font-weight:500;"></span>
                        <i class="fas fa-chevron-down" style="margin-left:4px;font-size:0.7rem;"></i>
                    </button>
                    <div class="profile-menu" id="profileMenu" style="display:none;">
                        <a href="/employee/profile" class="profile-menu-item"><i class="fas fa-user"></i> My Profile</a>
                        <div class="profile-menu-divider"></div>
                        <a href="#" class="profile-menu-item danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-body">
            <div class="mb-3 slide-up stagger-1" id="nextHolidayCard" style="display:none;"></div>

            <div class="card mb-3 slide-up stagger-2">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
                    <h3 style="font-weight:600;"><i class="fas fa-calendar-check" style="color:var(--secondary);margin-right:8px;"></i>Holiday Calendar</h3>
                    <div style="display:flex;gap:10px;align-items:center;">
                        <label style="font-weight:500;font-size:0.9rem;">Year:</label>
                        <input type="number" id="filterYear" class="form-control" style="width:100px;" onchange="loadData()">
                    </div>
                </div>
            </div>

            <div id="contentContainer">
                <div style="text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto;"></div></div>
            </div>
        </div>
    </main>

    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js"></script>
    <script src="../../js/tickets.js"></script>
    <script>
        const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

        document.addEventListener('DOMContentLoaded', () => {
            if (!checkAuth()) throw new Error('Not authenticated');
            document.getElementById('filterYear').value = new Date().getFullYear();
            loadData();
        });

        async function loadData() {
            const year = document.getElementById('filterYear').value;
            const data = await apiCall('/holidays?year=' + year);
            const container = document.getElementById('contentContainer');

            if (data && data.success) {
                const holidays = data.holidays || [];
                if (holidays.length === 0) {
                    document.getElementById('nextHolidayCard').style.display = 'none';
                    showEmptyState(container, 'fa-calendar-check', 'No Holidays', 'No holidays found for ' + year);
                    return;
                }

                const today = new Date();
                today.setHours(0,0,0,0);

                const upcoming = holidays.filter(h => new Date(h.date) >= today);
                const past = holidays.filter(h => new Date(h.date) < today);

                if (upcoming.length > 0) {
                    const next = upcoming[0];
                    const nextDate = new Date(next.date);
                    const diffDays = Math.ceil((nextDate - today) / (1000*60*60*24));
                    const card = document.getElementById('nextHolidayCard');
                    card.style.display = 'block';
                    card.innerHTML = '<div class="next-holiday-card">' +
                        '<div class="holiday-icon"><i class="fas fa-calendar-day"></i></div>' +
                        '<div class="holiday-info">' +
                            '<h3>Next Holiday: ' + escapeHtml(next.name) + '</h3>' +
                            '<p>' + formatDate(next.date) + (diffDays === 0 ? ' (Today!)' : ' &mdash; in ' + diffDays + ' day' + (diffDays !== 1 ? 's' : '')) + '</p>' +
                        '</div></div>';
                } else {
                    document.getElementById('nextHolidayCard').style.display = 'none';
                }

                let html = '';

                if (upcoming.length > 0) {
                    html += '<div class="card mb-3 slide-up stagger-3"><div class="section-title" style="color:var(--secondary);"><i class="fas fa-arrow-up"></i> Upcoming Holidays (' + upcoming.length + ')</div>';
                    html += '<div class="table-container"><table><thead><tr><th>Date</th><th>Day</th><th>Holiday Name</th><th>Description</th></tr></thead><tbody>';
                    upcoming.forEach(h => {
                        const d = new Date(h.date);
                        const isToday = d.toDateString() === today.toDateString();
                        const rowStyle = isToday ? 'background:var(--primary-50);' : '';
                        html += '<tr style="' + rowStyle + '">';
                        html += '<td><strong>' + formatDate(h.date) + '</strong>' + (isToday ? ' <span class="badge badge-primary" style="margin-left:5px;">Today</span>' : '') + '</td>';
                        html += '<td>' + dayNames[d.getDay()] + '</td>';
                        html += '<td style="font-weight:600;">' + escapeHtml(h.name) + '</td>';
                        html += '<td>' + escapeHtml(h.description || '-') + '</td>';
                        html += '</tr>';
                    });
                    html += '</tbody></table></div></div>';
                }

                if (past.length > 0) {
                    html += '<div class="card slide-up stagger-4"><div class="section-title" style="color:var(--text-secondary);"><i class="fas fa-arrow-down"></i> Past Holidays (' + past.length + ')</div>';
                    html += '<div class="table-container"><table><thead><tr><th>Date</th><th>Day</th><th>Holiday Name</th><th>Description</th></tr></thead><tbody>';
                    past.forEach(h => {
                        const d = new Date(h.date);
                        html += '<tr class="past-row">';
                        html += '<td><strong>' + formatDate(h.date) + '</strong></td>';
                        html += '<td>' + dayNames[d.getDay()] + '</td>';
                        html += '<td style="font-weight:600;">' + escapeHtml(h.name) + '</td>';
                        html += '<td>' + escapeHtml(h.description || '-') + '</td>';
                        html += '</tr>';
                    });
                    html += '</tbody></table></div></div>';
                }

                container.innerHTML = html;
            } else {
                showEmptyState(container, 'fa-exclamation-triangle', 'Error', 'Failed to load holidays');
            }
        }
    </script>
</body>
</html>
