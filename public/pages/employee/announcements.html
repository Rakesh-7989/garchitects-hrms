<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Announcements - G-Architects HRMS</title>
    <link rel="icon" type="image/png" href="../../assets/images/fav-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .filter-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 18px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-card); cursor: pointer; font-weight: 500; font-size: 0.85rem; transition: var(--transition); font-family: inherit; color: var(--text-secondary); }
        .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .announcement-card { padding: 24px; margin-bottom: 16px; border-left: 4px solid var(--info); transition: var(--transition); }
        .announcement-card:hover { box-shadow: var(--shadow-lg); }
        .announcement-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; }
        .announcement-content { color: var(--text-primary); line-height: 1.6; font-size: 0.95rem; }
        .announcement-content.truncated { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .read-more-btn { background: none; border: none; color: var(--primary); cursor: pointer; font-weight: 500; font-size: 0.85rem; padding: 0; margin-top: 4px; font-family: inherit; }
        .read-more-btn:hover { text-decoration: underline; }
        .announcement-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; font-size: 0.82rem; color: var(--text-tertiary); }
        @keyframes slideUp { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body class="employee-app">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo"><i class="fas fa-building" style="color:var(--primary-light);font-size:1.5rem;"></i><span style="font-size:1rem;font-weight:700;">G-Architects HRMS</span></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Main</div>
            <a href="/employee/dashboard" class="nav-item"><i class="fas fa-tachometer-alt"></i><span class="nav-text">Dashboard</span></a>
            <a href="/manager/my-team" id="myTeamLink" style="display:none;" class="nav-item"><i class="fas fa-users"></i><span class="nav-text">My Team</span></a>
            <div class="nav-section-title">My Info</div>
            <a href="/employee/profile" class="nav-item"><i class="fas fa-user"></i><span class="nav-text">My Profile</span></a>
            <a href="/employee/onboarding" class="nav-item"><i class="fas fa-user-plus"></i><span class="nav-text">My Onboarding</span></a>
            <a href="/employee/my-projects" class="nav-item"><i class="fas fa-project-diagram"></i><span class="nav-text">My Projects</span></a>
            <a href="/employee/attendance" class="nav-item"><i class="fas fa-clock"></i><span class="nav-text">Attendance</span></a>
            <a href="/employee/regularization" class="nav-item"><i class="fas fa-clock-rotate-left"></i><span class="nav-text">Regularization</span></a>
            <a href="/employee/leave" class="nav-item"><i class="fas fa-calendar-times"></i><span class="nav-text">Leave</span></a>
            <a href="/employee/wfh" class="nav-item"><i class="fas fa-home"></i><span class="nav-text">WFH</span></a>
            <a href="/employee/payslips" class="nav-item"><i class="fas fa-indian-rupee-sign"></i><span class="nav-text">Payslips</span></a>
            <div class="nav-section-title">Company</div>
            <a href="/employee/documents" class="nav-item"><i class="fas fa-file-alt"></i><span class="nav-text">Documents</span></a>
            <a href="/employee/announcements" class="nav-item active"><i class="fas fa-bullhorn"></i><span class="nav-text">Announcements</span></a>
            <div class="nav-section-title">Support</div>
            <a href="/employee/holidays" class="nav-item"><i class="fas fa-calendar-check"></i><span class="nav-text">Holidays</span></a>
            <div class="nav-section-title">Resources</div>
            <a href="/employee/directory" class="nav-item"><i class="fas fa-address-book"></i><span class="nav-text">Directory</span></a>
            <a href="/employee/tickets" class="nav-item"><i class="fas fa-ticket-alt"></i><span class="nav-text">My Queries</span></a>
        </nav>
    </aside>

    <main class="main-content" id="mainContent">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h2 style="font-size:1.25rem;font-weight:600;">Announcements</h2>
            </div>
            <div class="header-right">
                <button type="button" class="notification-btn" title="Notifications" style="color:var(--primary);"><i class="fas fa-bell"></i><span class="notification-badge" id="notifBadge" style="display:none;"></span></button>
                <button class="notification-btn" onclick="toggleDarkMode()" title="Toggle dark mode"><i class="fas fa-moon" id="themeIcon"></i></button>
                <div style="position:relative">
                    <button class="profile-btn" onclick="toggleProfileMenu()">
                        <span class="profile-photo" id="profilePhoto" style="display:inline-flex;align-items:center;justify-content:center;background:var(--primary);color:white;border-radius:50%;width:36px;height:36px;font-size:0.8rem;font-weight:600;"></span>
                        <span id="profileName" style="margin-left:8px;font-weight:500;"></span>
                        <i class="fas fa-chevron-down" style="margin-left:4px;font-size:0.7rem;"></i>
                    </button>
                    <div class="profile-menu" id="profileMenu" style="display:none;">
                        <a href="/employee/profile" class="profile-menu-item"><i class="fas fa-user"></i> My Profile</a>
                        <div class="profile-menu-divider"></div>
                        <a href="#" class="profile-menu-item danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-body">
            <div class="card mb-3 slide-up stagger-1">
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="filterBy('all', this)">All</button>
                    <button class="filter-btn" onclick="filterBy('high', this)"><i class="fas fa-exclamation-circle" style="color:var(--danger);margin-right:4px;"></i> High</button>
                    <button class="filter-btn" onclick="filterBy('normal', this)"><i class="fas fa-info-circle" style="color:var(--info);margin-right:4px;"></i> Normal</button>
                    <button class="filter-btn" onclick="filterBy('low', this)"><i class="fas fa-arrow-down" style="color:var(--secondary);margin-right:4px;"></i> Low</button>
                </div>
            </div>

            <div id="announcementsContainer">
                <div style="text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto;"></div></div>
            </div>
        </div>
    </main>

    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js"></script>
    <script src="../../js/tickets.js"></script>
    <script>
        let allAnnouncements = [];
        let currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            if (!checkAuth()) throw new Error('Not authenticated');
            loadAnnouncements();
            setInterval(loadAnnouncements, 15000);
        });

        async function loadAnnouncements() {
            const data = await apiCall('/announcements');
            if (data && data.success) {
                allAnnouncements = data.announcements || [];
                const unreadCount = allAnnouncements.filter(a => !a.is_read).length;
                renderAnnouncements();
                if (unreadCount > 0) {
                    showUnreadPopup(unreadCount);
                }
                if (unreadCount > 0) {
                    await apiCall('/announcements/read-all', 'POST');
                }
            } else {
                showEmptyState(document.getElementById('announcementsContainer'), 'fa-exclamation-triangle', 'Error', 'Failed to load announcements');
            }
        }

        function showUnreadPopup(count) {
            const container = document.getElementById('announcementsContainer');
            const popup = document.createElement('div');
            popup.style.cssText = 'background:var(--primary);color:white;padding:14px 20px;border-radius:var(--radius);margin-bottom:16px;display:flex;align-items:center;gap:12px;animation:slideUp 0.3s ease;';
            popup.innerHTML = '<i class="fas fa-bell" style="font-size:1.2rem;"></i><span style="font-weight:500;">You have <strong>' + count + '</strong> unread announcement' + (count > 1 ? 's' : '') + '</span><button onclick="this.parentElement.remove()" style="margin-left:auto;background:rgba(255,255,255,0.2);border:none;color:white;padding:4px 10px;border-radius:var(--radius);cursor:pointer;">Dismiss</button>';
            popup.setAttribute('data-unread-popup', 'true');
            container.insertBefore(popup, container.firstChild);
        }

        function filterBy(priority, btn) {
            currentFilter = priority;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderAnnouncements();
        }

        function renderAnnouncements() {
            const filtered = currentFilter === 'all' ? allAnnouncements : allAnnouncements.filter(a => a.priority === currentFilter);
            const container = document.getElementById('announcementsContainer');
            const existingPopup = container.querySelector('[data-unread-popup]');
            const popupHtml = existingPopup ? existingPopup.outerHTML : '';

            if (filtered.length === 0 && !popupHtml) {
                showEmptyState(container, 'fa-bullhorn', 'No Announcements', allAnnouncements.length === 0 ? 'No announcements have been posted yet' : 'No ' + currentFilter + ' priority announcements');
                return;
            }

            let html = popupHtml;
            filtered.forEach((a, index) => {
                const borderColors = { high: 'var(--danger)', normal: 'var(--info)', low: 'var(--secondary)' };
                const borderColor = borderColors[a.priority] || borderColors.normal;
                const isUnread = !a.is_read;

                html += '<div class="card announcement-card" style="border-left-color:' + borderColor + ';margin-bottom:16px;' + (isUnread ? 'background:var(--primary-50);border-left-width:6px;' : '') + '">';

                html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">';
                html += '<div class="announcement-title">' + (isUnread ? '<span style="display:inline-block;width:10px;height:10px;background:var(--primary);border-radius:50%;margin-right:8px;vertical-align:middle;"></span>' : '') + escapeHtml(a.title) + '</div>';
                html += '<div style="display:flex;gap:6px;flex-shrink:0;">';
                html += '<span class="badge badge-' + getPriorityBadge(a.priority) + '">' + escapeHtml(a.priority || 'normal') + '</span>';
                if (a.target_audience && a.target_audience !== 'all') {
                    html += '<span class="badge badge-secondary"><i class="fas fa-users" style="margin-right:3px;"></i>' + escapeHtml(a.target_audience) + '</span>';
                }
                html += '</div></div>';

                const contentId = 'content-' + index;
                const hasLongContent = (a.content || '').length > 200;
                html += '<div class="announcement-content' + (hasLongContent ? ' truncated' : '') + '" id="' + contentId + '">' + escapeHtml(a.content || '') + '</div>';
                if (hasLongContent) {
                    html += '<button class="read-more-btn" onclick="toggleContent(' + index + ', this)">Read more</button>';
                }

                html += '<div class="announcement-meta">';
                html += '<span><i class="fas fa-user" style="margin-right:4px;"></i>' + escapeHtml(a.posted_by_name || 'Admin') + '</span>';
                html += '<span><i class="fas fa-calendar" style="margin-right:4px;"></i>' + formatDate(a.created_at) + '</span>';
                if (isUnread) {
                    html += '<span class="badge badge-primary" style="font-size:0.65rem;">New</span>';
                }
                html += '</div>';

                html += '</div>';
            });

            container.innerHTML = html;
        }

        function toggleContent(index, btn) {
            const el = document.getElementById('content-' + index);
            if (el.classList.contains('truncated')) {
                el.classList.remove('truncated');
                btn.textContent = 'Show less';
            } else {
                el.classList.add('truncated');
                btn.textContent = 'Read more';
            }
        }
    </script>
</body>
</html>
