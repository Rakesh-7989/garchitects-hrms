name: temp-list-vercel-env

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
    - name: List Vercel project env vars (names + targets only)
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        TEAM_ID: team_Qd2Yf5z3r5asmq3HeHxCSie1
        PROJECT_ID: prj_oBetb56xW3BJtFhQLw2dQL2gzfw4
      run: |
        curl -sS "https://api.vercel.com/v9/projects/$PROJECT_ID/env?teamId=$TEAM_ID" \
          -H "Authorization: Bearer $VERCEL_TOKEN" \
          | jq -r '.envs[] | "\(.key) targets=\(.target|join(","))  type=\(.type)"' | sort