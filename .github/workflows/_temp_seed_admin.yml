name: temp-seed-admin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Seed admin account
      env:
        DATABASE_URL: ${{ secrets.HRMS_DATABASE_URL }}
        ADMIN_EMPLOYEE_ID: GA0001
        ADMIN_EMAIL: boyapatirakesh7989@gmail.com
        ADMIN_PASSWORD: ${{ secrets.ADMIN_SETUP_PASSWORD }}
        ADMIN_FIRST_NAME: Rakesh
        ADMIN_LAST_NAME: Boyapati
      run: node server/scripts/seed-admin.js