name: temp-diag-smtp-send

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Live SMTP send test (secrets injected, never logged)
      env:
        SMTP_USER: ${{ secrets.SMTP_TEST_USER }}
        SMTP_PASS: ${{ secrets.SMTP_TEST_PASS }}
        SMTP_HOST: ${{ secrets.SMTP_TEST_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_TEST_PORT }}
        TEST_TO: ${{ secrets.SMTP_TEST_TO }}
      run: node server/scripts/_diag_smtp_send.js