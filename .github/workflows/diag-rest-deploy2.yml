name: Diag Vercel REST Deploy 2 (temp)

on:
  workflow_dispatch:

jobs:
  deploy-rest:
    runs-on: ubuntu-24.04
    steps:
      - name: Try REST deployment with repoId + name
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_oBetb56xW3BJtFhQLw2dQL2gzfw4
          TEAM_ID: team_Qd2Yf5z3r5asmq3HeHxCSie1
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $VERCEL_TOKEN"
          echo "=== POST /v13/deployments (name + gitSource repoId=1377136928) ==="
          curl -sS -X POST "https://api.vercel.com/v13/deployments?teamId=$TEAM_ID" \
            -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"name":"garchitects-hrms","target":"production","gitSource":{"type":"github","repoId":1377136928,"ref":"master"}}' | head -c 1000
          echo ""
          echo "=== GET /v13/deployments?projectId= (list recent, proves auth) ==="
          curl -sS "https://api.vercel.com/v13/deployments?projectId=$PROJECT_ID&teamId=$TEAM_ID&limit=3" \
            -H "$AUTH" | head -c 600
          echo ""