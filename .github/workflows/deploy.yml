name: Deploy to Vercel

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Deploy to Vercel
      env:
        # org/project IDs hardcoded from .vercel/project.json (public identifiers).
        # Proven working: the temp env-set workflow used exactly these values
        # against the Vercel REST API and succeeded, so the token has access.
        # (secrets.VERCEL_ORG_ID / VERCEL_PROJECT_ID were unreliable - garbled on set.)
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: team_Qd2Yf5z3r5asmq3HeHxCSie1
        VERCEL_PROJECT_ID: prj_oBetb56xW3BJtFhQLw2dQL2gzfw4
        VERCEL_SCOPE: team_Qd2Yf5z3r5asmq3HeHxCSie1
      run: npx vercel@41.7.8 deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"
