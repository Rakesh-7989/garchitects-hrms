name: Set Vercel Env (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-env:
    runs-on: ubuntu-latest
    steps:
      - name: Test env endpoint access then upsert
        shell: bash
        env:
          VTOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
          TEAMID: team_Qd2Yf5z3r5asmq3HeHxCSie1
          DB_URL: ${{ secrets.HRMS_DATABASE_URL }}
          JWT: ${{ secrets.HRMS_JWT_SECRET }}
          SB_URL: ${{ secrets.HRMS_SUPABASE_URL }}
          SB_KEY: ${{ secrets.HRMS_SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $VTOKEN"
          JJ="Content-Type: application/json"
          Q="https://api.vercel.com/v9/projects/$PROJECT/env?teamId=$TEAMID"
          echo "=== GET env (status + short body) ==="
          curl -sS -w '\nHTTP=%{http_code}\n' -H "$AUTH" "$Q" | tail -20
          echo "=== POST a probe key env (status) ==="
          curl -sS -w '\nHTTP=%{http_code}\n' -X POST "$Q" -H "$AUTH" -H "$JJ" \
            -d '{"key":"__PROBE_KEY__","value":"probe","type":"encrypted","target":["production"]}' > probe-body.txt || true
          cat probe-body.txt | head -15
          echo "=== CLEANUP probe key ==="
          PID=$(curl -sS -H "$AUTH" "$Q" | jq -r '.envs[]? | select(.key=="__PROBE_KEY__") | .id')
          if [ -n "$PID" ]; then curl -sS -w 'HTTP=%{http_code}\n' -X DELETE "$Q/$PID" -H "$AUTH"; fi
          exit 0