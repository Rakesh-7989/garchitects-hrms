name: Set Vercel Env (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-env:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose token scope + upsert env vars
        shell: bash
        env:
          VTOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
          TEAMID: team_Qd2Yf5z3r5asmq3HeHxCSie1
          DB_URL: ${{ secrets.HRMS_DATABASE_URL }}
          JWT: ${{ secrets.HRMS_JWT_SECRET }}
          SB_URL: ${{ secrets.HRMS_SUPABASE_URL }}
          SB_KEY: ${{ secrets.HRMS_SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $VTOKEN"
          JJ="Content-Type: application/json"
          echo "=== WHOAMI ==="
          curl -sS -H "$AUTH" https://api.vercel.com/v2/user | jq -c '{id:.user.id, name:.user.name, username:.user.username, email:.user.email}'
          echo "=== TEAMS ==="
          curl -sS -H "$AUTH" 'https://api.vercel.com/v2/teams' | jq -c '.teams[]? | {id, slug, name}'
          echo "=== PROJECT (with teamId q) ==="
          curl -sS -H "$AUTH" "https://api.vercel.com/v9/projects/$PROJECT?teamId=$TEAMID" | jq -c '{id, name, owner:(.owner.id // .owner)}' 2>/dev/null || echo "(no project json)"
          echo "=== PROJECT (no team) ==="
          curl -sS -H "$AUTH" "https://api.vercel.com/v9/projects/$PROJECT" | jq -c '{id, name, owner:(.owner.id // .owner)}' 2>/dev/null || echo "(no project json)"
          echo "=== TRY LIST PROJECTS (no team) ==="
          curl -sS -H "$AUTH" 'https://api.vercel.com/v9/projects?limit=100' | jq -c '.projects[]? | {id, name, owner:(.owner.id // .owner)}' 2>/dev/null | head -40 || echo "(list failed)"
          exit 0