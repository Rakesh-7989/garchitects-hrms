name: Set Vercel Env (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set env vars via Vercel CLI
        shell: bash
        env:
          VTOKEN: ${{ secrets.VERCEL_TOKEN }}
          DB_URL: ${{ secrets.HRMS_DATABASE_URL }}
          JWT: ${{ secrets.HRMS_JWT_SECRET }}
          SB_URL: ${{ secrets.HRMS_SUPABASE_URL }}
          SB_KEY: ${{ secrets.HRMS_SUPABASE_SERVICE_KEY }}
          SCOPING: team_Qd2Yf5z3r5asmq3HeHxCSie1
        run: |
          set -euo pipefail
          V="npx --yes vercel@latest"
          setkey() {
            local key="$1"; local value="$2"
            echo "--- $key ---"
            $V env rm "$key" production preview --yes --token "$VTOKEN" --scope "$SCOPING" 2>/dev/null || true
            printf '%s' "$value" | $V env add "$key" production preview --token "$VTOKEN" --scope "$SCOPING" --yes
            echo "  (set OK)"
          }
          setkey "DATABASE_URL" "$DB_URL"
          setkey "JWT_SECRET" "$JWT"
          setkey "SUPABASE_URL" "$SB_URL"
          setkey "SUPABASE_SERVICE_KEY" "$SB_KEY"
          echo "=== final env ls ==="
          $V env ls --token "$VTOKEN" --scope "$SCOPING" 2>&1 | head -40